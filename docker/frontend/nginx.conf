# Same-origin reverse proxy: the browser only ever talks to this nginx server, which forwards
# /api/* to the backend container untouched (including cookies), and falls back to index.html
# for any other path (needed for the /share/:token client-side route on a real page load/reload).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # SPA fallback: any non-file, non-/api path (in particular /share/:token) serves index.html
    # so the frontend's own hand-rolled router can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
