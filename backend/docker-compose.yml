# Optional dev/test convenience only — NOT the primary documented way to run this backend
# (see README.md for the plain `php -S` + local MySQL path). This is provided for
# contributors who don't have PHP/MySQL installed natively.
services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             php -S 0.0.0.0:8000 -t public public/index.php"

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=photomap
      - MYSQL_USER=photomap
      - MYSQL_PASSWORD=photomap
    ports:
      - "3306:3306"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
